# Litestream (beeatlas-lwqi): the notes store, the one dataset on the volume that is
# user-authored and cannot be rebuilt from upstream, replicated continuously to S3.
# fly/start.sh runs the write API under `litestream replicate -exec`, so the store is
# replicated exactly while something can write it, and restores the store from here on
# a fresh volume before the API starts. The same arrangement as salishsea's.
#
# NOTES_REPLICA_URL names the replica: s3://<AuthoritativeBackupBucket>/replica/notes.db
# in production (infra/lib/beeatlas-stack.ts grants the NotesReplicaWriter user that
# prefix and nothing else), another prefix for a staging app, and an s3:// URL with an
# endpoint parameter for an S3-compatible test server. The region is stated, not
# discovered: the key's ListBucket is conditioned on the prefix, so a region lookup
# (HeadBucket, no prefix) would be refused.
dbs:
  - path: /data/notes/notes.db
    replica:
      url: ${NOTES_REPLICA_URL}
      region: us-west-2

# A full snapshot a day, kept thirty days: how far back a point-in-time restore reaches.
# The bucket's versioning keeps anything Litestream deletes for 180 days more.
snapshot:
  interval: 24h
  retention: 720h
