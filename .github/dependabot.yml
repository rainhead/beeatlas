version: 2

# One pull request a month covering every update — npm in all three pnpm
# projects, uv, and GitHub Actions together — instead of one pull request per
# ecosystem and directory each week. Most of those were closed unmerged because
# the next week's bump replaced them. Majors join the group too; ignore rules
# below still apply inside it. Security fixes don't wait for the month: they
# come from Dependabot security updates (repository settings), as their own PRs.
multi-ecosystem-groups:
  monthly:
    schedule:
      interval: monthly

updates:
  - package-ecosystem: github-actions
    directory: /
    multi-ecosystem-group: monthly
    patterns: ['*']

  # `npm` is also Dependabot's name for the pnpm ecosystem; what it needs from us
  # is a lockfile format it groks, and pnpm 11 writes lockfileVersion 9, which it
  # supports. Its handling of the pnpm 11 CLI is newer ground, so if updates go
  # quiet after the pnpm migration (ADR 0038), check Insights → Dependency graph →
  # Dependabot for a FAILING run rather than assuming there is nothing to update.
  #
  # Each directory below is its own pnpm project with its own pnpm-lock.yaml and
  # pnpm-workspace.yaml — not a workspace, so each needs its own entry here.
  - package-ecosystem: npm
    directory: /
    multi-ecosystem-group: monthly
    patterns: ['*']
    ignore:
      # @types/node tracks the Node major (.nvmrc → 26); don't let it jump ahead
      # of the runtime (types for Node 27 APIs would typecheck but fail at run).
      # Bump this major by hand when the Node version moves.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  # infra/ is the AWS CDK project. CI builds, tests and runs `cdk synth` on it
  # (since 390aa075), so a broken bump fails the PR checks instead of passing.
  - package-ecosystem: npm
    directory: /infra
    multi-ecosystem-group: monthly
    patterns: ['*']
    ignore:
      # Same reason as the root entry: hold @types/node to the Node major.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  # data/ holds the pipeline's Node tooling (mapshaper), split out of the root
  # package.json in beeatlas-dqh. Without an entry here it would be a dependency
  # tree that nothing watches.
  - package-ecosystem: npm
    directory: /data
    multi-ecosystem-group: monthly
    patterns: ['*']

  - package-ecosystem: uv
    directory: /data
    multi-ecosystem-group: monthly
    patterns: ['*']
    ignore:
      # DuckDB 2.0 is a deliberate move, not a routine bump: the pipeline's SQL
      # needs changes (2.0 refuses the `x -> f(x)` lambda), and the DuckDB
      # command-line program pinned in fly/downloads.tsv and Stelis's CI must
      # move with this library in the same change. Which release line every
      # project shares is undecided (workbench-gp3). Until then, hold the major.
      - dependency-name: duckdb
        update-types: ['version-update:semver-major']
