version: 2
updates:
  # GitHub Actions — weekly, minor+patch grouped
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions — install-lychee composite action. The github-actions entry
  # at "/" only scans .github/workflows/*, NOT composite actions under
  # .github/actions/ (confirmed Phase 145 WR-02: its actions/cache lagged a patch
  # behind deploy.yml's). A directory entry pointing at the composite action's
  # folder is required to keep it updated.
  - package-ecosystem: "github-actions"
    directory: "/.github/actions/install-lychee"
    schedule:
      interval: "weekly"
    groups:
      install-lychee-actions-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # npm — root package.json / package-lock.json, weekly, minor+patch grouped
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # @types/node tracks the Node major (.nvmrc → 24); don't let it jump ahead
      # of the runtime (types for Node 25 APIs would typecheck but fail at run).
      # Bump this major by hand when the Node version moves.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # npm — infra/ AWS CDK project (package.json / package-lock.json), weekly, minor+patch grouped
  - package-ecosystem: "npm"
    directory: "/infra"
    schedule:
      interval: "weekly"
    groups:
      infra-npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # @types/node tracks the Node major (.nvmrc → 24); don't let it jump ahead
      # of the runtime. Bump this major by hand when the Node version moves.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 (the native port) removes the JS API surface ts-node reads
      # — `ts.sys` is undefined, so `ts-node bin/infra.ts` dies at startup and
      # takes BOTH `npm test` and `cdk synth`/`cdk deploy` with it (cdk.json's
      # app command). Verified against 7.0.2 on 2026-07-28 when PR #55 was
      # rejected. ts-node's latest stable is still 10.9.2 (2023), so the fix is
      # to drop ts-node — not to bump it. NOTE: no CI job builds infra/, so this
      # breakage is invisible to the PR checks; it must be caught by hand.
      # Unpin once infra/ moves off ts-node (bd beeatlas-fa7).
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # npm — data/ pipeline Node tooling (mapshaper), weekly, minor+patch grouped.
  # This tree was split out of the root package.json in beeatlas-dqh; without an
  # entry here it would be a 227-package dependency tree that nothing watches,
  # which is the opposite of the point of splitting it.
  - package-ecosystem: "npm"
    directory: "/data"
    schedule:
      interval: "weekly"
    groups:
      data-npm-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # uv — data/ pyproject.toml / uv.lock, weekly, minor+patch grouped
  - package-ecosystem: "uv"
    directory: "/data"
    schedule:
      interval: "weekly"
    groups:
      python-minor-patch:
        update-types:
          - "minor"
          - "patch"
