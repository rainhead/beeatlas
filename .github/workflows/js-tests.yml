name: JS tests

# The CI test legs that survived deploy.yml's deletion (Model Y, stelis ADR
# 0007 Amendment: "The GH-Actions deploy leg retires (CI test legs remain)").
# Build/smoke/Lighthouse are NOT here: `npm run build` needs the data dir
# (fetch-data or pull-published), which CI does not have — the nightly on
# maderas is where the built site is exercised.
#
# Same reason, and the one this workflow originally got wrong (beeatlas-6q2):
# `npm test` must stay data-free. Any suite that reads the pipeline's artifacts
# is named *.data.test.ts, excluded in vite.config.ts, and run by the nightly
# via `npm run test:data`. This job is deliberately credential-free — do not add
# an AWS fetch step to make a data-dependent test pass here.

# Push-only, like python-tests.yml: every PR here comes from a branch in this
# repo, so the push run on the PR's head commit already shows as its check, and
# a pull_request trigger only ran the same suite on the same commit twice.
on:
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: js-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: vitest + typecheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Before setup-node, which needs pnpm on PATH to locate the store for
      # `cache: pnpm`. The version comes from package.json's `packageManager`.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

      - run: pnpm run typecheck
