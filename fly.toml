# The beeatlas Fly app (ADR 0042): one Machine, one volume. The image is fly/Dockerfile;
# fly/start.sh is its one process, with Caddy, the write API and the schedule under it.
#
# Do NOT split them into [processes] groups. Each group gets a Machine of its own, and
# the volume attaches to one Machine, while the synchronous note publish needs the API,
# the pipeline's state and the site root on one filesystem (ADR 0042).
#
# The size was measured on the trial nightlies (beeatlas-f21l, 2026-10-22/23). A warm
# 03:00 run took 10.5 minutes, faster than maderas, and peaked at 3.0 GB, so 4 GB with
# 2 GB less would not do. Shared vCPUs run at full speed only on a burst allowance of
# up to 500 CPU-seconds, rebuilt while idle; the first run on a new Machine, with
# almost none, took 100 minutes and timed two JS data tests out. A nightly that does
# far more work than usual (a fresh Stelis state, a large upstream change) will be
# slow the same way.
# San Jose, the nearest region since Fly retired Seattle; salishsea-io and beeline run
# there too. The volume (beeatlas_data, 20 GB) was created there on 2026-10-22.

app = "beeatlas"
primary_region = "sjc"

# fly/start.sh stops the schedule first, so a running nightly gets SIGTERM and runs its
# EXIT trap, the offsite backup. 300 s is the most Fly allows.
kill_signal = "SIGTERM"
kill_timeout = 300

[build]
  dockerfile = "fly/Dockerfile"

# Not secrets. The secrets are set with `fly secrets set` (fly/Dockerfile names them).
[env]
  API_ENABLED = "1"
  WRITES_ENABLED = "true"
  NOTE_PUBLISH_ENABLED = "true"

[http_service]
  internal_port = 8080
  force_https = true
  # One Machine that must always run: it serves, and the schedule lives on it.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  # Caddy's own /healthz, so a fresh volume with no site yet passes. A failing check
  # only stops Fly routing here; fly/start.sh's watchdog restarts a wedged Caddy.
  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[mounts]
  source = "beeatlas_data"
  destination = "/data"
  initial_size = "20gb"
  snapshot_retention = 14

[[vm]]
  size = "shared-cpu-2x"
  memory = "4gb"
