# The beeatlas Fly app (ADR 0042): one Machine, one volume. The image is fly/Dockerfile;
# fly/start.sh is its one process, with Caddy, the write API and the schedule under it.
#
# Do NOT split them into [processes] groups. Each group gets a Machine of its own, and
# the volume attaches to one Machine, while the synchronous note publish needs the API,
# the pipeline's state and the site root on one filesystem (ADR 0042).
#
# The size: since the nightly moved to Hostess (ADR 0046), the most memory the Machine
# needs is a full render, which a deploy runs on first boot after the JS data tests and
# a note save falls back to when its receipt check fails. fly/offline-gate.sh measured
# it on 2026-11-07 (beeatlas-uibw.7): the deploy render passed under a hard limit of
# 1.3 GB and was killed under 1.0 GB, the data tests being the larger part; a note
# save peaked near 0.3 GB. Caddy, the API and Litestream hold about 0.25 GB beside it.
# So 2 GB. Two shared CPUs rather than one, so a deploy's render holds the publish
# lock, which note saves wait on, for as short a time as before. To check a change
# against this size: GATE_MEMORY=1600m bash fly/offline-gate.sh <image> <export dir>.
# San Jose, the nearest region since Fly retired Seattle; salishsea-io and beeline run
# there too. The volume (beeatlas_data, 20 GB) was created there on 2026-10-22.

app = "beeatlas"
primary_region = "sjc"

# fly/start.sh stops the schedule first, so a running job gets SIGTERM and time to
# finish. 300 s is the most Fly allows.
kill_signal = "SIGTERM"
kill_timeout = 300

[build]
  dockerfile = "fly/Dockerfile"

# Not secrets. The secrets are set with `fly secrets set` (fly/Dockerfile names them).
[env]
  API_ENABLED = "1"
  WRITES_ENABLED = "true"
  NOTE_PUBLISH_ENABLED = "true"

[http_service]
  internal_port = 8080
  force_https = true
  # One Machine that must always run: it serves, and the API and the schedule live on it.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  # Caddy's own /healthz, so a fresh volume with no site yet passes. A failing check
  # only stops Fly routing here; fly/start.sh's watchdog restarts a wedged Caddy.
  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[mounts]
  source = "beeatlas_data"
  destination = "/data"
  initial_size = "20gb"
  snapshot_retention = 14

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
