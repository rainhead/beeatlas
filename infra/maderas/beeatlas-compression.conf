# BeeAtlas — what gets compressed on the way out, and how (beeatlas-tb8).
#
# Deployed to /etc/apache2/beeatlas-compression.conf and Included from BOTH
# beeatlas.net vhosts, for the same reason the species redirects are a separate
# file: port 80 serves the site directly (it does not redirect to HTTPS) and
# certbot's -le-ssl clone is generated on the host, so anything written inline
# has to be written twice and eventually is not. When these rules lived in the
# vhost, the :443 copy — the one that serves essentially all real traffic — was
# a hand-maintained duplicate that had already drifted.
#
# This file restores what the CloudFront distribution used to do for free, and
# what its teardown quietly took away with it. A cold load of the atlas was
# measured at 37 MB over 35 requests on 2026-08-02, of which 33.5 MB was two
# things this file now fixes.

# ---------------------------------------------------------------------------
# 1. On-the-fly compression, for everything small and text-shaped.
# ---------------------------------------------------------------------------
#
# text/javascript is the entry that matters: it is what Apache actually serves
# .js and .mjs as (/etc/mime.types), while this list named only the legacy
# application/javascript, so the entire 1.29 MB bundle shipped uncompressed
# while the css and json beside it — also listed, and correctly named — did not.
# That is what made compression look like it was working.
#
# Note this directive REPLACES the list in mods-available/deflate.conf for the
# scope it appears in rather than adding to it, so that file having
# text/javascript is no help; the name has to be here.
#
# application/wasm is wa-sqlite (0.53 MB -> ~0.15 MB), which every cold load of
# the atlas fetches. Both entries stay: application/javascript costs nothing and
# covers a client or module that sets the legacy type explicitly.
AddOutputFilterByType DEFLATE \
    text/html text/css text/javascript application/javascript \
    application/json application/wasm \
    image/svg+xml application/xml application/atom+xml

# GeoJSON is JSON, and Apache does not know it: without this the county,
# ecoregion, wilderness and place layers have no type at all, which no filter
# below or above can match on.
AddType application/json .geojson

# ---------------------------------------------------------------------------
# 2. Pre-compressed data artifacts, for the one thing too big to compress live.
# ---------------------------------------------------------------------------
#
# scripts/postbuild-data.mjs writes `<name>-<hash>.<ext>.br` and `.gz` beside
# each hashed artifact at build time (lib/precompress.js); these rules serve one
# of them under the artifact's own URL when the request says it can be decoded.
# occurrences.db is ~34 MB and brotlis to 4.2 MB — the largest item in a cold
# load by an order of magnitude, and the best candidate for compression in the
# whole site. It is also the worst candidate for doing it per request: this is a
# prefork server that also runs the nightly pipeline, and every cold load would
# pay the CPU again. Building it once per publish is free at request time and
# affords a level the live path could not have afforded. See docs/adr/0024.
#
# Scoped to content-hashed names deliberately. Those are immutable, so a variant
# can never describe different bytes than the file beside it; manifest.json
# (no-cache, rewritten every publish) and the stable dirs stay with mod_deflate
# above, where staleness is not a question that can arise.
RewriteEngine On
RewriteCond "%{HTTP:Accept-Encoding}" "\bbr\b"
RewriteCond "%{DOCUMENT_ROOT}/$1.br" -s
RewriteRule "^/(data/[^/]+-[0-9a-f]{12}\.[^/.]+)$" "/$1.br" [E=no-gzip:1,L]
RewriteCond "%{HTTP:Accept-Encoding}" "\bgzip\b"
RewriteCond "%{DOCUMENT_ROOT}/$1.gz" -s
RewriteRule "^/(data/[^/]+-[0-9a-f]{12}\.[^/.]+)$" "/$1.gz" [E=no-gzip:1,L]

# A missing variant is not an error anywhere: the `-s` condition fails, the rule
# does not fire, and the original is served — the same thing that happens for a
# client accepting neither encoding, or for an artifact that compresses too
# poorly for the build step to bother (parquet). Which means this config is safe
# to deploy before, after, or without the build that produces the siblings.

# mod_mime reads the encoding off the extension the rewrite just added and takes
# the Content-Type from what is left, so `…-<hash>.db.gz` is served as
# `application/octet-stream` + `Content-Encoding: gzip`: the response describes
# the ORIGINAL artifact, which is what the client asked for and what its cache
# will hold. (`AddType` for .db because Apache otherwise gives a database no
# type at all — which is also why no AddOutputFilterByType rule could ever have
# matched it.)
AddEncoding gzip .gz
AddEncoding br .br
AddType application/octet-stream .db

# …except that `.gz` is ALSO a content type in /etc/mime.types (application/gzip),
# and for the trailing extension the type wins: without this, the gzip variant is
# served as `application/gzip` and the response describes its own encoding instead
# of the artifact. `.br` is not in mime.types, so it falls through on its own,
# which is exactly why the discrepancy is easy to miss — the br path, the one a
# browser takes, looks right. Verified on this host against Apache 2.4.58.
# RemoveType is not valid at vhost level; <FilesMatch> is, and it matches the
# REWRITTEN filename, which is the one that grew the extension.
<FilesMatch "\.gz$">
    RemoveType .gz
</FilesMatch>

# Two representations under one URL — say so, or a shared cache hands one
# client's encoding to another. `merge` rather than `append`: mod_deflate
# already sets Vary on the responses it compresses, and this must not double it.
<LocationMatch "^/data/">
    Header merge Vary Accept-Encoding
</LocationMatch>
