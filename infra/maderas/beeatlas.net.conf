# beeatlas.net served from maderas (stelis ADR 0007, st-bgy).
# Install: docs/runbooks/serve-from-maderas.md. This is the port-80 vhost;
# `certbot --apache` clones it into beeatlas.net-le-ssl.conf (TLS + the
# HTTPS redirect) once DNS points here — same setup as api.beeatlas.net.
<VirtualHost *:80>
    ServerName beeatlas.net
    ServerAlias www.beeatlas.net

    # The root data/nightly.sh's publish step merges into (SITE_ROOT): the
    # rendered _site tree at /, hashed data artifacts + manifest under /data.
    # htdocs+var convention (Model Y): htdocs is served; the sibling var/ holds
    # pipeline state (beeatlas.duckdb, export/, baseline/, publish.lock) —
    # never reachable from the web.
    DocumentRoot /var/www/beeatlas.net/htdocs
    <Directory /var/www/beeatlas.net/htdocs>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    # Cache policy ports the S3/CloudFront semantics (deploy.yml + nightly.sh):
    # default max-age=0 — HTML and anything unhashed revalidates every request.
    Header set Cache-Control "max-age=0"
    # Content-hashed files are immutable: 11ty/vite bundles under /assets/, and
    # nightly's data artifacts (<basename>-<hash12>.<ext>) under /data/.
    <LocationMatch "^/(assets/|data/[^/]+-[0-9a-f]{12}\.)">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>
    # The manifest resolves the current hashed names and must never be cached
    # stale (the SW's data-manifest NetworkFirst route depends on this).
    <Location "/data/manifest.json">
        Header set Cache-Control "no-cache"
    </Location>

    # CloudFront auto-compressed application/json responses; here mod_deflate
    # does. (Parquet/db artifacts stay uncompressed — internally compressed.)
    AddOutputFilterByType DEFLATE text/html text/css application/javascript application/json image/svg+xml application/xml application/atom+xml
    AddType application/json .geojson

    # The self-hosted basemap tile archive (beeatlas-hvp). Served from a THIRD
    # sibling of the htdocs+var convention, deliberately OUTSIDE DocumentRoot:
    # data/merge-swap.sh only ever writes inside htdocs, so no nightly, code
    # publish or note publish can reach or prune this ~227 MB quarterly artifact.
    # Separation by construction, not by an --exclude someone later drops.
    # Only /basemap/tiles is aliased; /basemap/fonts and /basemap/sprites fall
    # through to DocumentRoot, because those ARE build output (public/basemap),
    # versioned with the code that references them. NOTE: they are not yet in the
    # SW precache — vite.sw.config.ts globs only app/index.html + assets/**, and
    # its globIgnores excludes **/*.png, which will also need overriding for the
    # sprite sheets. Adding them is beeatlas-6rs.
    Alias /basemap/tiles /var/www/beeatlas.net/basemap
    <Directory /var/www/beeatlas.net/basemap>
        Options -Indexes
        AllowOverride None
        Require all granted
        # Range requests are the entire access pattern — PMTiles reads a header,
        # then a directory, then individual tiles out of one 227 MB file. Never
        # let a content-encoding filter near it: on-the-fly compression breaks
        # byte-range semantics, and the tile payloads inside are already
        # compressed, so there is nothing to win.
        SetEnv no-gzip 1
        Header set Accept-Ranges "bytes"
    </Directory>
    AddType application/octet-stream .pmtiles
    # Archives are content-addressed by build date and never rewritten.
    <LocationMatch "^/basemap/tiles/wa-[0-9]{8}\.pmtiles$">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>
    # ...but the manifest resolving the current archive name must not go stale.
    <Location "/basemap/tiles/manifest.json">
        Header set Cache-Control "no-cache"
    </Location>

    # 301s for species names the atlas has folded into another name. Shared with
    # certbot's -le-ssl clone of this vhost, which needs the same Include line.
    Include /etc/apache2/beeatlas-species-redirects.conf

    ErrorLog ${APACHE_LOG_DIR}/beeatlas.net-error.log
    CustomLog ${APACHE_LOG_DIR}/beeatlas.net-access.log combined
</VirtualHost>
