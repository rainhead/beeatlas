# BeeAtlas — 301 a folded species name to the name it was folded into.
#
# Deployed to /etc/apache2/beeatlas-species-redirects.conf and Included from BOTH
# beeatlas.net vhosts. It is a separate file rather than inline rules because
# port 80 serves the site directly (it does not redirect to HTTPS) and certbot's
# -le-ssl clone is generated on the host — one file Included twice keeps the two
# from drifting.
#
# The redirect TABLE is data, not config: /species-redirects.map is emitted by
# the site build (_pages/species-redirects-map.njk) from the dbt synonym seeds
# and reaches the docroot through an ordinary publish. Adding a synonym needs no
# root, no config edit and no reload — mod_rewrite re-reads a txt map when the
# file's mtime changes. Verified on this host 2026-07-31: a line appended to the
# live map 301'd a new path on the next request, with no reload.
#
# Belt and braces: the build also emits an HTML page at each folded URL that
# meta-refreshes to the accepted name (_pages/species-redirect.njk, same source
# list). If this map is ever missing or stale, the reader is still forwarded —
# the failure mode is the slower redirect, not a 404.
#
# 301 is deliberate: a taxonomic fold is a curatorial decision, not a temporary
# move, and search engines should consolidate on the accepted name. Note the
# vhost's `Header set Cache-Control "max-age=0"` applies to these responses too,
# so a reversed fold is not stuck in browser caches indefinitely.

RewriteEngine On
RewriteMap species_redirect "txt:/var/www/beeatlas.net/htdocs/species-redirects.map"

# $1 is the folded path captured by the rule below — a RewriteCond may reference
# the groups of the RewriteRule it guards. The condition both tests for a hit and
# captures the target as %1; an empty lookup fails to match, so any species that
# was never folded falls straight through to its own page.
RewriteCond "${species_redirect:$1}" "^(.+)$"
RewriteRule "^(/species/[^/]+/[^/]+/)(index\.html)?$" "%1" [R=301,L]

# mod_rewrite reads the map from disk; nothing should fetch it over HTTP.
<Files "species-redirects.map">
    Require all denied
</Files>
