# mod_evasive on maderas — thresholds sized for a self-hosted vector basemap.
#
# Installed to /etc/apache2/mods-available/evasive.conf by apply-evasive.sh.
# Tracked here for the same reason beeatlas.net.conf is: serving config that the
# site depends on should not live only on the host.
#
# WHY THE STOCK VALUES BROKE THE SITE (beeatlas-cit, 2026-08-02)
#
# The Debian defaults are DOSPageCount 2 / DOSPageInterval 1 — more than two
# requests to ONE URI in a second. That is a reasonable rule for pages. It is an
# impossible rule for a PMTiles archive, which is a single URI that every basemap
# tile is read from with an HTTP range request. Since beeatlas-q73 moved the
# basemap off Mapbox and onto this host, ordinary panning trips it constantly.
#
# The blast radius is the whole vhost, not the archive: mod_evasive blocks by
# client IP, so a user who pans the map starts getting 403s on the page itself,
# on the occurrence database and on the boundary GeoJSON. Observed in production
# within minutes of the deploy.
#
# MEASURED PEAKS (one client, real bundle, real archive, no server in the way —
# counts are per sliding 1s window, the same quantity this module counts):
#
#     13/s   cold page load @ z7, 1400x900
#     21/s   zoom sweep 14->11->14
#     31/s   cold zoom sweep, 1920x1200
#     75/s   ten pans 120ms apart, 1920x1200   <- worst legitimate case measured
#     35/s   site-wide, cold page load @ z14, 1920x1200
#
# THE NUMBERS BELOW are ~4x that worst case. The headroom is not padding:
#
#   - The ceiling scales with viewport area times gesture rate. A 4K display or a
#     faster fling exceeds 75 on its own.
#   - Counting is per CLIENT IP, so a field team on one hotspot or a workshop
#     behind one NAT aggregates into a single counter.
#   - maderas runs mpm_prefork and mod_evasive's hash table is per child process,
#     so one client's requests split across children and no child sees the true
#     rate. That is why the failures were intermittent — and why a threshold
#     fitted tightly to a measured peak would still fire unpredictably.
#
# Raising the INTERVALS instead would be the wrong lever: it scales the counts
# proportionally and makes a block slower to clear.
#
# Be honest about what this leaves: at these values the module stops little short
# of a runaway script. If the conclusion is that a static site does not want a WAF
# in front of it, removing mod_evasive is a cleaner answer than thresholds chosen
# never to fire. That decision is open in beeatlas-cit.
<IfModule mod_evasive20.c>
    DOSHashTableSize    3097
    DOSPageCount        300
    DOSSiteCount        500
    DOSPageInterval     1
    DOSSiteInterval     1
    DOSBlockingPeriod   10

    #DOSEmailNotify      you@yourdomain.com
    #DOSSystemCommand    "su - someuser -c '/sbin/... %s ...'"
    DOSLogDir           "/var/log/apache2/evasive"
</IfModule>
