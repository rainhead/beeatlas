<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BeeAtlas</title>
    <link rel="icon" href="data:,">
    <link rel="alternate" type="application/atom+xml" title="Washington Bee Atlas — All Recent Determinations" href="/data/feeds/determinations.xml">
    <!-- The PWA shell lives HERE now, not at /app/ (ADR 0029). The BROWSER — not
         the app — fetches these when it launches a standalone install, which is why
         they are precached (scripts/sw-precache-globs.ts) even though no code
         requests them. Under /pwa/ rather than at the root because Ubuntu Apache
         aliases /icons/ to its own mod_autoindex directory — see eleventy.config.js. -->
    <link rel="manifest" href="/pwa/manifest.webmanifest" />
    <!-- iOS standalone + status bar -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="BeeAtlas" />
    <!-- iOS home-screen icon: 180x180, opaque -->
    <link rel="apple-touch-icon" href="/pwa/icons/apple-touch-icon-180.png" />
    <!-- theme color for browser chrome (belt-and-suspenders; Android Chrome reads manifest) -->
    <meta name="theme-color" content="#080d26" />
    {% viteAssets "src/index.css" %}
    <!-- src/app-entry.ts, NOT src/bee-atlas.ts: this page IS the app now. That entry
         is what registers the service worker and starts the data prime, and it is
         referenced by NO other template — the separation is what keeps the 3.3 MB
         precache and the ~34.8 MB prime off a reader who only opened a species page
         (ADR 0029). -->
    {% viteAssets "src/app-entry.ts" %}
  </head>
  <body>
    <bee-atlas></bee-atlas>
  </body>
</html>
