<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BeeAtlas — moved to /</title>
    <link rel="icon" href="data:,">
    <link rel="canonical" href="/" />
    <meta name="robots" content="noindex" />
    <meta http-equiv="refresh" content="0; url=/" />
    <!--
      The deprecation window for /app/ (ADR 0029). The app is at / now; this page
      exists only so an installed PWA whose start_url is still /app/index.html, or a
      bookmark, lands somewhere.

      It is a page rather than an Apache redirect because the site has no server
      config in this repo, and the population is one installed PWA — the
      maintainer's phone.

      Getting here at all requires the OLD service worker to be gone. It was
      registered at /app/sw.js with scope /app/ and precached /app/index.html, so
      while it lives it answers this navigation from its own cache and never sees
      this file. The build no longer emits /app/sw.js, so the browser's next update
      check for it 404s and the registration is dropped; src/sw-registration.ts also
      unregisters any surviving /app/ scope from the root page. Delete this file once
      the phone has migrated.

      Both a meta refresh and a script: the meta tag works with JS disabled, the
      replace() keeps the dead URL out of session history so Back does not bounce.
    -->
    <script>location.replace('/' + location.search + location.hash);</script>
  </head>
  <body>
    <p>BeeAtlas has moved to <a href="/">beeatlas.net</a>.</p>
  </body>
</html>
