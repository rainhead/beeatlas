reviews:
  # Keep generated pipeline artifacts out of AI review. public/data/places.geojson
  # is a single ~920 KB line and places.json is machine-emitted; neither is written
  # by hand, and both are regenerated by the nightly.
  path_filters:
    - "!public/data/**"
    - "!.beads/**"
  # Peter's own branches are reviewed with the CodeRabbit CLI before the pull
  # request is opened, so the PR bot skips his PRs. Everyone else's it still reviews.
  auto_review:
    ignore_usernames: ["rainhead"]
